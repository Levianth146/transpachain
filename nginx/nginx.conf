events { worker_connections 1024; }

http {
  client_max_body_size 10m;

  server {
    listen 80;
    server_name transpachain.site www.transpachain.site;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name transpachain.site www.transpachain.site;

    ssl_certificate     /etc/letsencrypt/live/transpachain.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/transpachain.site/privkey.pem;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:3001;
    set $frontend_upstream http://frontend:3000;

    location /api/ {
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass $backend_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /socket.io/ {
      proxy_pass $backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }

    location / {
      proxy_pass $frontend_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
