events { worker_connections 1024; }

http {
  upstream backend  { server backend:3001; }
  upstream frontend { server frontend:3000; }

  server {
    listen 80;
    server_name transpachain.site www.transpachain.site;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name transpachain.site www.transpachain.site;

    ssl_certificate     /etc/letsencrypt/live/transpachain.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/transpachain.site/privkey.pem;

    location /api/ {
      proxy_pass http://backend/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /socket.io/ {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }

    location / {
      proxy_pass http://frontend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
