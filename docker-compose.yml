version: "3.9"

services:
  mongodb:
    image: mongo:7.0
    container_name: transpachain-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: transpachain

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: transpachain-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    depends_on:
      - mongodb
    env_file:
      - ./backend/.env
    environment:
      MONGODB_URI: mongodb://mongodb:27017/transpachain

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: transpachain-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local
    depends_on:
      - backend

volumes:
  mongo_data:
