services:
  mongodb:
    image: mongo:7.0
    container_name: transpachain-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: transpachain

  backend:
    image: cuongnguyen146/transpachain-backend:latest
    container_name: transpachain-backend
    restart: unless-stopped
    depends_on:
      - mongodb
    environment:
      MONGODB_URI: mongodb://mongodb:27017/transpachain
      PORT: "3001"
      ALCHEMY_SEPOLIA_URL: ${ALCHEMY_SEPOLIA_URL}
      CHARITY_CORE_ADDRESS: ${CHARITY_CORE_ADDRESS}
      DONATION_VAULT_ADDRESS: ${DONATION_VAULT_ADDRESS}
      GOVERNANCE_DAO_ADDRESS: ${GOVERNANCE_DAO_ADDRESS}
      IMPACT_NFT_ADDRESS: ${IMPACT_NFT_ADDRESS}
      PINATA_API_KEY: ${PINATA_API_KEY}
      PINATA_SECRET_KEY: ${PINATA_SECRET_KEY}
      CORS_ORIGIN: http://localhost

  frontend:
    image: cuongnguyen146/transpachain-frontend:latest
    container_name: transpachain-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://localhost/api
      NEXT_PUBLIC_ALCHEMY_KEY: ${NEXT_PUBLIC_ALCHEMY_KEY}
      NEXT_PUBLIC_CHARITY_CORE_ADDRESS: ${NEXT_PUBLIC_CHARITY_CORE_ADDRESS}
      NEXT_PUBLIC_DONATION_VAULT_ADDRESS: ${NEXT_PUBLIC_DONATION_VAULT_ADDRESS}
      NEXT_PUBLIC_GOVERNANCE_DAO_ADDRESS: ${NEXT_PUBLIC_GOVERNANCE_DAO_ADDRESS}
      NEXT_PUBLIC_IMPACT_NFT_ADDRESS: ${NEXT_PUBLIC_IMPACT_NFT_ADDRESS}

  nginx:
    image: nginx:alpine
    container_name: transpachain-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend

volumes:
  mongo_data:
