name: transpachain
services:
  mongodb:
    image: mongo:7.0
    container_name: transpachain-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: transpachain

  backend:
    image: cuongnguyen146/transpachain-backend:latest
    container_name: transpachain-backend
    restart: unless-stopped
    depends_on:
      - mongodb
    environment:
      MONGODB_URI: mongodb://mongodb:27017/transpachain
      PORT: "3001"
      ALCHEMY_SEPOLIA_URL: ${ALCHEMY_SEPOLIA_URL}
      SEPOLIA_RPC_URL: ${SEPOLIA_RPC_URL:-}
      SEPOLIA_RPC_FALLBACK_URL: ${SEPOLIA_RPC_FALLBACK_URL:-}
      INFURA_SEPOLIA_URL: ${INFURA_SEPOLIA_URL:-}
      HEALTH_CHECK_TIMEOUT_MS: ${HEALTH_CHECK_TIMEOUT_MS:-8000}
      CHARITY_CORE_ADDRESS: ${CHARITY_CORE_ADDRESS}
      DONATION_VAULT_ADDRESS: ${DONATION_VAULT_ADDRESS}
      GOVERNANCE_DAO_ADDRESS: ${GOVERNANCE_DAO_ADDRESS}
      IMPACT_NFT_ADDRESS: ${IMPACT_NFT_ADDRESS}
      PINATA_API_KEY: ${PINATA_API_KEY}
      PINATA_SECRET_KEY: ${PINATA_SECRET_KEY}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://transpachain.site}
      DEPLOY_FROM_BLOCK: ${DEPLOY_FROM_BLOCK:-}
      INDEXER_LOG_CHUNK_SIZE: ${INDEXER_LOG_CHUNK_SIZE:-10}
      INDEXER_POLL_INTERVAL_MS: ${INDEXER_POLL_INTERVAL_MS:-60000}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    image: cuongnguyen146/transpachain-frontend:latest
    container_name: transpachain-frontend
    restart: unless-stopped
    depends_on:
      - backend
    # NEXT_PUBLIC_* must be passed at image BUILD time (see frontend/Dockerfile ARG).
    # Runtime environment below does not update already-built client JS.
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_ALCHEMY_KEY: ${NEXT_PUBLIC_ALCHEMY_KEY}
        NEXT_PUBLIC_CHARITY_CORE_ADDRESS: ${NEXT_PUBLIC_CHARITY_CORE_ADDRESS}
        NEXT_PUBLIC_DONATION_VAULT_ADDRESS: ${NEXT_PUBLIC_DONATION_VAULT_ADDRESS}
        NEXT_PUBLIC_GOVERNANCE_DAO_ADDRESS: ${NEXT_PUBLIC_GOVERNANCE_DAO_ADDRESS}
        NEXT_PUBLIC_IMPACT_NFT_ADDRESS: ${NEXT_PUBLIC_IMPACT_NFT_ADDRESS}
        NEXT_PUBLIC_USDC_ADDRESS: ${NEXT_PUBLIC_USDC_ADDRESS}
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://localhost/api

  nginx:
    image: nginx:alpine
    container_name: transpachain-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started

volumes:
  mongo_data:
